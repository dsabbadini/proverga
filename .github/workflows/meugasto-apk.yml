name: Meu Gasto - APK Android

# Compila o app a cada mudança em gastos/ e publica o APK em Releases,
# no endereço fixo .../releases/latest/download/MeuGasto.apk
on:
  push:
    branches: [main, master, claude/expense-dashboard-app-97fisy]
    paths:
      - 'gastos/**'
      - '.github/workflows/meugasto-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meugasto-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 (testes do núcleo)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes
        working-directory: gastos
        run: npm test

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Chave de assinatura (segredo do repositório, se configurado)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/meugasto.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/meugasto.keystore" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        working-directory: gastos/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          [ -n "$KEY_ALIAS" ] || unset KEY_ALIAS
          if [ -z "${KEYSTORE_FILE:-}" ]; then
            echo "::warning::Sem segredo KEYSTORE_BASE64: APK assinado com chave temporária. Para atualizar será preciso desinstalar (exporte o backup antes). Veja gastos/docs/APP-ANDROID.md"
          fi
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MeuGasto.apk"

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MeuGasto-${{ github.run_number }}
          path: MeuGasto.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="meugasto-v${{ github.run_number }}"
          gh release create "$TAG" MeuGasto.apk \
            --target "${{ github.sha }}" \
            --title "Meu Gasto ${{ github.run_number }}" \
            --notes "APK gerado a partir de ${{ github.ref_name }} (${GITHUB_SHA::7}). Chave fixa: ${KEYSTORE_FILE:+sim}${KEYSTORE_FILE:-não (desinstale a versão anterior antes de instalar; exporte o backup)}." \
            --latest
